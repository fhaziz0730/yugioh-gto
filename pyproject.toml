[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yugioh-gto"
version = "0.1.0"
description = "Recurrent self-play research pipeline for Yu-Gi-Oh!"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "torch>=2.3,<3", "tensorboard>=2.16,<3"]

[project.scripts]
ygo = "yugioh_gto.cli:main"

[tool.setuptools.packages.find]
include = ["yugioh_gto*"]
